name: CI

# Runs on every push to main and on every pull request: formatting,
# static checks, tests. This is the gate that keeps broken code out of
# main; publishing is handled by release.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Matches go.mod; setup-go reads the go directive from it.
          go-version-file: go.mod
          cache: true

      # The UI tests lay out real frames, which needs cgo's font stack.
      - name: Enable cgo
        shell: pwsh
        run: echo "CGO_ENABLED=1" >> $env:GITHUB_ENV

      - name: gofmt
        shell: pwsh
        run: |
          # List files that are not formatted; fail if there are any.
          #
          # Note: on Windows, if core.autocrlf checks files out as CRLF,
          # gofmt reports every file as unformatted. The repository has a
          # .gitattributes forcing LF, and this turns the conversion off
          # as a second guard.
          git config --global core.autocrlf false

          $files = @(gofmt -l internal cmd main.go 2>$null)
          if ($files.Count -gt 0) {
            Write-Host "These files are not formatted:" -ForegroundColor Red
            $files | ForEach-Object { Write-Host "  $_" }
            Write-Host ""
            Write-Host "Run 'gofmt -w internal cmd main.go' locally to fix." -ForegroundColor Yellow
            exit 1
          }
          Write-Host "All Go files are properly formatted" -ForegroundColor Green

      - name: go vet
        run: go vet ./...

      - name: mygo vet
        run: go tool mygo vet .

      - name: Test
        run: go test ./... -count=1

      # State is shared across goroutines here (background operations
      # updating the main thread), so the race detector is the most
      # valuable check we have.
      - name: Test with race detector
        run: go test -race ./internal/app/ -count=1

      - name: Build
        run: go build ./...

      # The wslc-compose command-line tool is published with every release, so
      # check here that it builds on its own (no cgo) and starts. `config`
      # needs no wslc, so this also works on a runner that has none. (That it
      # does not link the GUI toolkit is checked by a Go test.)
      - name: Command-line tool
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "wslc-compose.exe"
          go build -trimpath -o $exe ./cmd/wslc-compose
          if ($LASTEXITCODE -ne 0) { throw "go build failed" }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "wslc-compose --version failed" }

          $dir = Join-Path $env:RUNNER_TEMP "cli-smoke"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Set-Content -Path (Join-Path $dir "compose.yaml") -Value "services:`n  web:`n    image: nginx:alpine`n"
          Push-Location $dir
          try { $out = (& $exe config) -join "`n" } finally { Pop-Location }
          if ($LASTEXITCODE -ne 0 -or $out -notmatch "image: nginx:alpine") {
            throw "wslc-compose config did not print the service:`n$out"
          }
          Write-Host "wslc-compose works: config printed the service"

  # Keeps the catalogs and the source in sync: every string used in code
  # must have an English translation, and the generated accessors must
  # match the catalogs.
  locales:
    name: Check translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify generated accessors are up to date
        # mygo generate produces generated code. Editing a catalog without
        # regenerating would otherwise slip through, giving the confusing
        # symptom "translation changed but the UI did not".
        run: |
          go tool mygo i18n check
          go tool mygo generate
          if ! git diff --quiet; then
            echo "::error::locales/catalog_gen.go is out of sync with the catalogs; run 'go tool mygo generate' and commit"
            git diff
            exit 1
          fi
