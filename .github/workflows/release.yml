name: Release

# Publishing a vX.X.X tag publishes a release.
#
# Steps:
#   1. Set mygo.json's version to the tag's version (build artifacts and
#      the installer name both take it from there).
#   2. mygo build produces the portable executable and the NSIS installer.
#   3. Zip, checksums, and upload to the GitHub release of that tag.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the release and upload artifacts

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Enable cgo
        shell: pwsh
        run: echo "CGO_ENABLED=1" >> $env:GITHUB_ENV

      # Must be green before publishing: a wrong tag can be deleted,
      # but a broken binary that people downloaded cannot be taken back.
      - name: Test before publishing
        run: go test ./... -count=1

      - name: Set version from tag
        id: version
        shell: pwsh
        run: |
          # Tags look like v0.2.0; the version is 0.2.0.
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v', ''
          if ($ver -notmatch '^\d+\.\d+\.\d+') {
            Write-Host "Bad tag: $tag, expected vX.Y.Z" -ForegroundColor Red
            exit 1
          }
          Write-Host "Version: $ver"

          # Write it back into mygo.json so the artifacts and the
          # installer carry this version.
          $path = "mygo.json"
          $json = Get-Content $path -Raw | ConvertFrom-Json
          $json.version = $ver
          $json | ConvertTo-Json -Depth 20 | Set-Content $path -Encoding utf8

          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        run: go tool mygo build -platform windows/amd64

      - name: Package
        id: package
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $out = "build/windows-amd64"

          # Portable: executable plus docs, extract and run.
          $zip = "WSLC-Manager-$ver-windows-amd64.zip"
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item "$out/WSLC Manager.exe" stage/
          Copy-Item "README.md" stage/
          Copy-Item "README-zh.md" stage/
          Copy-Item "LICENSE" stage/ -ErrorAction SilentlyContinue
          Compress-Archive -Path "stage/*" -DestinationPath $zip -Force

          # The installer comes from mygo build; rename it to a stable,
          # versioned name.
          $setup = Get-ChildItem "$out/*setup*.exe" | Select-Object -First 1
          if (-not $setup) { throw "Installer not found" }
          $setupName = "WSLC-Manager-Setup-$ver-windows-amd64.exe"
          Copy-Item $setup.FullName $setupName

          "zip=$zip" >> $env:GITHUB_OUTPUT
          "setup=$setupName" >> $env:GITHUB_OUTPUT

      - name: Checksums
        shell: pwsh
        run: |
          $files = @("${{ steps.package.outputs.zip }}", "${{ steps.package.outputs.setup }}")
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$hash  $f"
          }
          $lines | Set-Content SHA256SUMS.txt -Encoding utf8
          Get-Content SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: WSLC Manager ${{ steps.version.outputs.version }}
          draft: false
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.setup }}
            SHA256SUMS.txt
          body: |
            ## WSLC Manager ${{ steps.version.outputs.version }}

            A desktop app for managing [WSL containers](https://learn.microsoft.com/windows/wsl/wsl-container) (`wslc`) on Windows.

            **Downloads**
            - `${{ steps.package.outputs.setup }}` — installer (recommended)
            - `${{ steps.package.outputs.zip }}` — portable, extract and run
            - `SHA256SUMS.txt` — verify your download

            **Requirements**
            - Windows 10/11 with WSL (`winget install Microsoft.WSL`)
            - `wslc-compose` (`uv tool install wslc-compose`)

            Both are checked on the **System** page, which can install or upgrade them for you.

            **Highlights**
            - Containers: start, stop, restart, remove, live stats and streaming logs
            - Images: pull with live progress, browse tags, update one or all
            - Volumes and networks: create, inspect, delete
            - Compose projects: full stack control through `wslc-compose`
            - Chinese and English UI, switchable in Settings
            - Six accent colors
            - Diagnostic reports with versions, element coordinates and recent logs
