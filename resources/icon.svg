<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    层叠容器，无提示符。
    在第一轮方案 A 上只去掉顶层「>」，其余堆叠、比例、配色不变。
    顶卡用一层很淡的左上高光补体积，避免挖掉符号后显得空，
    不加任何新图形或文字。
  -->
  <defs>
    <linearGradient id="a-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171E2C"/>
      <stop offset="100%" stop-color="#0A0F18"/>
    </linearGradient>
    <linearGradient id="a-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8AD0FF"/>
      <stop offset="100%" stop-color="#3B8EFF"/>
    </linearGradient>
    <linearGradient id="a-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2F6AE0"/>
      <stop offset="100%" stop-color="#1A4BB8"/>
    </linearGradient>
    <linearGradient id="a-bot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#163A7A"/>
      <stop offset="100%" stop-color="#0C2760"/>
    </linearGradient>
    <!-- 顶卡左上高光：很淡，只补体积 -->
    <linearGradient id="a-sheen" x1="0.12" y1="0" x2="0.55" y2="0.85">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="38%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="a-tile-clip">
      <rect width="1024" height="1024" rx="228"/>
    </clipPath>
    <clipPath id="a-top-clip">
      <rect x="212" y="256" width="600" height="264" rx="72"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#a-tile)"/>
  <rect width="1024" height="1024" rx="228" fill="none"
        stroke="#ffffff" stroke-opacity="0.10" stroke-width="8"
        clip-path="url(#a-tile-clip)"/>

  <!-- 下层略宽，小尺寸下侧面也能看出「叠」 -->
  <rect x="172" y="516" width="680" height="264" rx="72" fill="url(#a-bot)"/>
  <rect x="192" y="386" width="640" height="264" rx="72" fill="url(#a-mid)"/>
  <rect x="212" y="256" width="600" height="264" rx="72" fill="url(#a-top)"/>

  <!-- 顶卡高光，裁在卡片圆角内 -->
  <rect x="212" y="256" width="600" height="264" rx="72"
        fill="url(#a-sheen)" clip-path="url(#a-top-clip)"/>
  <!-- 顶沿一条更淡的亮边，让卡片有一点厚度 -->
  <path d="M 284 268 H 740"
        fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="8"
        stroke-linecap="round" clip-path="url(#a-top-clip)"/>
</svg>
