<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    WSLC Manager 图标

    设计原则（这一版为小尺寸重做）：
    - 只有两个形状：上面大的「容器层」+ 下面较暗的同类层。
      元素越少，缩小后越不容易糊成一团。
    - 主形占画布约 55%，16px 下仍有足够像素表达轮廓。
    - 提示符 >_ 用粗笔画，且两笔之间留足空隙——
      否则大尺寸下会连成一块黑色，读不出是终端。
    - 深色底 + 亮蓝主形，任务栏里对比强、好定位。

    上一版的问题：三层横条挨得太近，缩到 32px 后
    融成一片横纹，既看不出容器也看不出终端。
  -->

  <!-- 圆角方形底 -->
  <rect width="1024" height="1024" rx="228" fill="#101722"/>

  <!-- 下层容器：较暗、略收窄，暗示「还有一层」 -->
  <rect x="268" y="552" width="488" height="192" rx="96" fill="#1c6499"/>

  <!-- 上层容器：主形，亮蓝，承载提示符 -->
  <rect x="228" y="280" width="568" height="288" rx="120" fill="#3d9bfd"/>

  <!--
    提示符 >_
    箭头收在左侧一半，下划线放在右下且与之保持明显间隙，
    保证大小两种尺寸下都能读出「两个符号」。
  -->
  <g fill="none" stroke="#0a0f18" stroke-width="88"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M352 344 L466 400 L352 456"/>
    <path d="M544 442 L636 442"/>
  </g>
</svg>
